apiVersion: v2
name: coredns
version: 1.50.5
appVersion: 1.14.7
home: https://coredns.io
icon: https://coredns.io/images/CoreDNS_Colour_Horizontal.png
description: CoreDNS is a DNS server that chains plugins and provides Kubernetes DNS Services
keywords:
  - coredns
  - dns
  - kubedns
sources:
  - https://github.com/coredns/coredns
maintainers:
  - name: mrueg
  - name: haad
  - name: hagaibarel
  - name: shubham-cmyk
type: application
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: The readiness probe starts without an initial delay (readinessProbe.initialDelaySeconds 0), so a pod receives queries once the ready plugin reports it ready, not 30 s later
    - kind: changed
      description: The liveness probe starts without an initial delay (livenessProbe.initialDelaySeconds 0); failureThreshold 5 and periodSeconds 10 still give a starting pod 50 s before a restart

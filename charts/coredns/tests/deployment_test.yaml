# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: CoreDNS Deployment Tests
templates:
  - templates/configmap.yaml
  - templates/deployment.yaml

tests:
  - it: should render a deployment with the correct image
    set:
      deployment:
        enabled: true
      image:
        repository: coredns/coredns
        tag: 1.10.1
    documentIndex: 0
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: coredns/coredns:1.10.1

  - it: should include tolerations when isClusterService is true
    set:
      deployment:
        enabled: true
      isClusterService: true
      tolerations:
        - key: CriticalAddonsOnly
          operator: Exists
    documentIndex: 0
    template: templates/deployment.yaml
    asserts:
      - exists:
          path: spec.template.spec.tolerations

  - it: should contain checksum/config annotation
    set:
      deployment:
        enabled: true
    documentIndex: 0
    template: templates/deployment.yaml
    asserts:
      - matchRegex:
          path: spec.template.metadata.annotations.checksum/config
          pattern: ^[a-f0-9]{64}$

  - it: should set pod security context and priority class
    set:
      deployment:
        enabled: true
      podSecurityContext:
        runAsUser: 1000
      priorityClassName: system-cluster-critical
    documentIndex: 0
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 1000
      - equal:
          path: spec.template.spec.priorityClassName
          value: system-cluster-critical

  - it: should still apply customLabels to the main CoreDNS deployment
    set:
      deployment:
        enabled: true
      customLabels:
        team: dns
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: metadata.labels.team
          value: dns
      - equal:
          path: spec.template.metadata.labels.team
          value: dns

  - it: should run CoreDNS as the image's non-root user under the restricted Pod Security Standard by default
    set:
      deployment:
        enabled: true
    documentIndex: 0
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsUser
          value: 65532
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsGroup
          value: 65532
      - equal:
          path: spec.template.spec.containers[0].securityContext.seccompProfile.type
          value: RuntimeDefault
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - equal:
          path: spec.template.spec.containers[0].securityContext.capabilities.add
          value: [NET_BIND_SERVICE]

  - it: should default containerPorts when a server has no port
    set:
      deployment:
        enabled: true
      servers:
        - zones:
            - zone: .
          plugins:
            - name: errors
        - zones:
            - zone: example.org
              scheme: tls://
          plugins:
            - name: errors
    documentIndex: 0
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].ports
          value:
            - containerPort: 53
              name: udp-53
              protocol: UDP
            - containerPort: 853
              name: tcp-853
              protocol: TCP

  - it: should start the readiness probe without a delay by default
    template: templates/deployment.yaml
    documentIndex: 0
    asserts:
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.initialDelaySeconds
          value: 0

  - it: should take the readiness delay from values
    set:
      readinessProbe:
        initialDelaySeconds: 10
    template: templates/deployment.yaml
    documentIndex: 0
    asserts:
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.initialDelaySeconds
          value: 10

  - it: should start the liveness probe without a delay by default
    template: templates/deployment.yaml
    documentIndex: 0
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.initialDelaySeconds
          value: 0

  - it: should take the liveness delay from values
    set:
      livenessProbe:
        initialDelaySeconds: 30
    template: templates/deployment.yaml
    documentIndex: 0
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.initialDelaySeconds
          value: 30

  - it: should mount extraSecrets readable by the non-root CoreDNS user by default
    set:
      extraSecrets:
        - name: etcd-client-certs
          mountPath: /etc/coredns/tls/etcd
    template: templates/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: etcd-client-certs
            secret:
              secretName: etcd-client-certs
              defaultMode: 0444

  - it: should keep an explicit extraSecrets defaultMode
    set:
      extraSecrets:
        - name: etcd-client-certs
          mountPath: /etc/coredns/tls/etcd
          defaultMode: 288
    template: templates/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: etcd-client-certs
            secret:
              secretName: etcd-client-certs
              defaultMode: 288

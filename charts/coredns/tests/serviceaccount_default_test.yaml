# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: ServiceAccount defaults Test

templates:
  - templates/serviceaccount.yaml
  - templates/clusterrolebinding.yaml
  - templates/deployment.yaml
  - templates/configmap.yaml

release:
  namespace: test-namespace
  name: test-release

tests:
  - it: should create a ServiceAccount by default
    template: templates/serviceaccount.yaml
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: test-release-coredns

  - it: should bind the ClusterRole to the chart's ServiceAccount by default, not to default
    template: templates/clusterrolebinding.yaml
    asserts:
      - equal:
          path: subjects[0].name
          value: test-release-coredns
      - notEqual:
          path: subjects[0].name
          value: default

  - it: should run CoreDNS as the chart's ServiceAccount by default
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: test-release-coredns

  - it: should keep using the namespace's default ServiceAccount when create is false and no name is set
    set:
      serviceAccount:
        create: false
    template: templates/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: default

  - it: should not render a ServiceAccount when create is false
    set:
      serviceAccount:
        create: false
    template: templates/serviceaccount.yaml
    asserts:
      - hasDocuments:
          count: 0

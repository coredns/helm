# CNTi Test Suite configuration for the CoreDNS chart, used by
# .github/workflows/cnti.yml. The chart is installed with its defaults.
config_version: "v2"
common:
  container_names:
    # Released CoreDNS tags the rolling update, downgrade and rollback tests
    # move the image to. None of them may be the chart's appVersion: setting
    # the installed tag rolls out nothing. When appVersion changes, earlier
    # releases are the natural choice.
    - name: coredns
      rolling_update_test_tag: "1.14.4"
      rolling_downgrade_test_tag: "1.13.2"
      rolling_version_change_test_tag: "1.14.4"
      rollback_from_tag: "1.14.4"
deployments:
  helm_dirs:
    - name: coredns
      # Relative to this file.
      helm_directory: ../../charts/coredns
      namespace: coredns-cnti
